<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- A portrait frame on a landscape, the rest dimmed: what wallframe does. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f9fe8"/>
      <stop offset="1" stop-color="#a9d3fa"/>
    </linearGradient>
    <clipPath id="card"><rect x="6" y="18" width="116" height="92" rx="12"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect x="6" y="18" width="116" height="92" fill="url(#sky)"/>
    <circle cx="71" cy="47" r="9" fill="#ffd34d"/>
    <path d="M6 110 L42 58 L64 86 L80 68 L122 110 Z" fill="#2f8a62"/>
    <path d="M6 110 L28 80 L54 110 Z" fill="#23704f"/>
    <!-- What the monitor will not show is dimmed, as in the editor -->
    <path fill="#000" fill-opacity="0.5" fill-rule="evenodd"
          d="M6 18h116v92H6z M42 28h44v72H42z"/>
  </g>
  <rect x="6" y="18" width="116" height="92" rx="12" fill="none"
        stroke="#000" stroke-opacity="0.18" stroke-width="2"/>
  <!-- The frame's corners: dark under white, so they show on any sky -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#14324f" stroke-opacity="0.55" stroke-width="9">
      <path d="M42 41 V28 H55"/><path d="M73 28 H86 V41"/>
      <path d="M86 87 V100 H73"/><path d="M55 100 H42 V87"/>
    </g>
    <g stroke="#fff" stroke-width="5">
      <path d="M42 41 V28 H55"/><path d="M73 28 H86 V41"/>
      <path d="M86 87 V100 H73"/><path d="M55 100 H42 V87"/>
    </g>
  </g>
</svg>
